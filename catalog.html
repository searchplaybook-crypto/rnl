<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="R&L Books catalog — academic textbooks, legal books, Wildy & Sons imports, digital and software licences. Enquire for institutional supply.">
  <meta name="author" content="R&L Books (Pty) Ltd">
  <meta name="theme-color" content="#22080b">
  <title>Catalog | R&L Books — Academic, Legal & Digital Supply</title>

  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=zodiak@400,500,600,700&f[]=switzer@400,500,600,700,800&display=swap">

  <style>
    :root{
      --ink:#171717;
      --paper:#fbfaf8;
      --white:#fff;
      --maroon:#3a0b10;
      --crimson:#7d1f2d;
      --red:#a72e3c;
      --gold:#d89a21;
      --gold-soft:#f5dfaa;
      --muted:#68707a;
      --line:#e7e2dc;
      --soft:#f2eee9;
      --dark:#16090b;
      --shadow:0 18px 50px rgba(32,12,14,.10);
      --radius:22px;
      --max:1180px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--ink);
      background:var(--paper);
      font-family:"Zodiak",Georgia,serif;
      font-size:18px;
      line-height:1.65;
    }
    img{max-width:100%;display:block}
    a{color:inherit}
    button,input,textarea,select{font:inherit}
    .container{width:min(var(--max),calc(100% - 36px));margin-inline:auto}
    .ui{font-family:"Switzer",Arial,sans-serif}
    .eyebrow{
      display:inline-flex;align-items:center;gap:8px;
      color:var(--gold);
      font:800 11px/1 "Switzer",sans-serif;
      letter-spacing:.16em;text-transform:uppercase;
    }
    .section{padding:92px 0}
    .section-head{max-width:780px;margin-bottom:48px}
    .section-head.center{text-align:center;margin-inline:auto}
    .section-head h2{
      margin:12px 0 14px;
      font:800 clamp(32px,4vw,50px)/1.08 "Switzer",Arial,sans-serif;
      letter-spacing:-.035em;color:var(--maroon);
    }
    .section-head p{margin:0;color:#5f646b;font-size:20px}
    .icon-mark{font-family:"Switzer",Arial,sans-serif;font-weight:800;display:inline-block;min-width:1em;text-align:center}

    .btn{
      border:0;border-radius:12px;padding:14px 20px;
      display:inline-flex;justify-content:center;align-items:center;gap:10px;
      font:800 12px/1 "Switzer",sans-serif;
      letter-spacing:.08em;text-transform:uppercase;text-decoration:none;
      cursor:pointer;transition:.2s ease;
    }
    .btn:hover{transform:translateY(-2px)}
    .btn-primary{background:var(--gold);color:#1a1208;box-shadow:0 10px 24px rgba(216,154,33,.22)}
    .btn-dark{background:var(--maroon);color:#fff}
    .btn-outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.32)}
    .btn-light{background:#fff;color:var(--maroon);border:1px solid var(--line)}
    .btn-enquire{
      display:inline-flex;align-items:center;gap:8px;
      font:800 11px/1 "Switzer",sans-serif;
      letter-spacing:.1em;text-transform:uppercase;
      color:var(--crimson);text-decoration:none;
      border-bottom:1px solid rgba(125,31,45,.3);
      padding-bottom:4px;transition:.2s ease;
      background:transparent;cursor:pointer;
    }
    .btn-enquire:hover{color:var(--maroon);border-bottom-color:var(--maroon)}
    .btn-enquire.on-dark{color:var(--gold);border-bottom-color:rgba(216,154,33,.4)}
    .btn-enquire.on-dark:hover{color:var(--gold-soft);border-bottom-color:var(--gold-soft)}

    /* Header */
    .site-header{
      position:absolute;top:0;left:0;right:0;z-index:100;
      background:rgba(10,5,7,.16);
      backdrop-filter:blur(14px) saturate(125%);
      -webkit-backdrop-filter:blur(14px) saturate(125%);
      border-bottom:1px solid rgba(255,255,255,.14);
      transition:background .3s ease,box-shadow .3s ease,border-color .3s ease;
    }
    .site-header.scrolled{
      position:fixed;
      background:rgba(18,7,9,.68);
      border-bottom-color:rgba(216,154,33,.22);
      box-shadow:0 12px 40px rgba(0,0,0,.18);
    }
    .utility{
      background:rgba(8,4,5,.62);color:#e6dddd;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .utility-inner{
      min-height:34px;display:flex;align-items:center;justify-content:flex-end;gap:18px;
      font:600 10px "Switzer",sans-serif;
    }
    .utility span{display:inline-flex;align-items:center;gap:7px}
    .nav{height:78px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
    .brand img{width:72px;height:48px;object-fit:contain}
    .brand-name{font:800 20px/1 "Switzer",sans-serif;color:#fff;letter-spacing:-.025em}
    .brand-sub{
      display:block;margin-top:5px;color:#e4c77d;
      font:700 9px/1 "Switzer",sans-serif;letter-spacing:.13em;text-transform:uppercase;
    }
    .desktop-nav{
      display:flex;align-items:center;gap:22px;
      font:700 10px "Switzer",sans-serif;
      text-transform:uppercase;letter-spacing:.07em;
    }
    .desktop-nav a{text-decoration:none;color:#fff}
    .desktop-nav a:hover{color:var(--gold)}
    .desktop-nav a.active{color:var(--gold);border-bottom:1px solid var(--gold);padding-bottom:3px}
    .nav-actions{display:flex;align-items:center;gap:10px}
    .enquiry-btn{
      position:relative;
      display:inline-flex;align-items:center;gap:8px;
      padding:11px 16px;border-radius:12px;
      background:rgba(255,255,255,.08);color:#fff;
      border:1px solid rgba(255,255,255,.2);
      font:800 10px "Switzer",sans-serif;
      letter-spacing:.08em;text-transform:uppercase;
      cursor:pointer;transition:.2s ease;
    }
    .enquiry-btn:hover{background:rgba(255,255,255,.15)}
    .enquiry-count{
      display:inline-grid;place-items:center;
      min-width:20px;height:20px;padding:0 6px;
      border-radius:999px;background:var(--gold);color:#1a1208;
      font:800 10px "Switzer",sans-serif;
    }
    .menu-btn{
      width:44px;height:44px;border:1px solid rgba(255,255,255,.28);
      border-radius:12px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;
      display:none;
    }
    .mobile-panel{
      display:none;
      border-top:1px solid rgba(255,255,255,.12);
      background:rgba(18,7,9,.92);backdrop-filter:blur(18px);
      padding:10px 18px 18px;
    }
    .mobile-panel.open{display:block}
    .mobile-panel a{
      display:block;padding:13px 0;
      border-bottom:1px solid rgba(255,255,255,.1);
      font:700 12px "Switzer",sans-serif;
      text-decoration:none;text-transform:uppercase;letter-spacing:.05em;color:#fff;
    }

    /* Hero */
    .hero{
      position:relative;overflow:hidden;color:#fff;
      background:
        linear-gradient(120deg,rgba(22,5,8,.97),rgba(80,15,25,.92) 52%,rgba(21,21,21,.97)),
        url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&q=85") center/cover;
    }
    .hero:after{
      content:"";position:absolute;inset:auto -10% -45% auto;
      width:600px;height:600px;
      border:1px solid rgba(216,154,33,.18);border-radius:50%;
      box-shadow:0 0 0 70px rgba(216,154,33,.035),0 0 0 140px rgba(216,154,33,.025);
    }
    .hero-inner{
      min-height:560px;display:flex;align-items:center;
      position:relative;z-index:2;padding:110px 0 80px;
    }
    .hero-copy{max-width:820px}
    .hero h1{
      margin:20px 0;
      font:900 clamp(38px,5.5vw,64px)/1.05 "Switzer",Arial,sans-serif;
      letter-spacing:-.05em;
    }
    .hero h1 span{color:var(--gold)}
    .hero p{max-width:680px;color:#eadfe0;font-size:20px;line-height:1.55}
    .hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}

    /* Value strip */
    .value-strip{
      background:var(--maroon);color:#fff;
      padding:18px 0;border-bottom:1px solid rgba(255,255,255,.08);
    }
    .value-strip-inner{
      display:flex;align-items:center;justify-content:space-between;
      gap:18px;flex-wrap:wrap;
      font:600 12px "Switzer",sans-serif;
    }
    .value-strip strong{color:var(--gold);font-weight:800}
    .value-strip-items{display:flex;gap:22px;flex-wrap:wrap}
    .value-strip-items span{display:inline-flex;align-items:center;gap:8px;color:#e2d8d9}
    .value-strip-items i{color:var(--gold);font-style:normal}

    /* Divisions */
    .divisions{background:var(--paper)}
    .division-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
    .division-card{
      background:#fff;border:1px solid var(--line);border-radius:22px;
      padding:32px;display:flex;flex-direction:column;
      box-shadow:0 10px 30px rgba(25,10,12,.05);
      transition:.25s ease;
    }
    .division-card:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(25,10,12,.10)}
    .division-tag{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 10px;border-radius:999px;
      font:800 10px "Switzer",sans-serif;
      letter-spacing:.1em;text-transform:uppercase;
      width:max-content;
    }
    .division-tag.academic{background:rgba(216,154,33,.15);color:#8a5c00}
    .division-tag.legal{background:rgba(125,31,45,.12);color:var(--crimson)}
    .division-tag.digital{background:rgba(58,11,16,.08);color:var(--maroon)}
    .division-icon{
      width:56px;height:56px;border-radius:16px;margin:22px 0 18px;
      display:grid;place-items:center;font-size:24px;
    }
    .division-icon.academic{background:rgba(216,154,33,.12);color:var(--gold)}
    .division-icon.legal{background:rgba(125,31,45,.1);color:var(--crimson)}
    .division-icon.digital{background:rgba(58,11,16,.08);color:var(--maroon)}
    .division-card h3{
      margin:0 0 10px;
      font:800 22px/1.15 "Switzer",Arial,sans-serif;color:var(--maroon);
      letter-spacing:-.02em;
    }
    .division-card p{margin:0 0 18px;color:#5c6167;font-size:16px}
    .division-card ul{
      list-style:none;padding:0;margin:0 0 22px;display:grid;gap:8px;
    }
    .division-card li{
      display:flex;gap:10px;align-items:flex-start;
      color:#4a4f55;font-size:15px;
    }
    .division-card li i{color:var(--gold);font-style:normal;font-weight:800}
    .division-card .btn-enquire{margin-top:auto}

    /* Wildy legal subject taxonomy */
    .wildy-taxonomy{background:var(--dark);color:#fff}
    .wildy-taxonomy .section-head h2{color:#fff}
    .wildy-taxonomy .section-head p{color:#cfc3c5}
    .cat-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:16px;
    }
    .cat-card{
      background:rgba(255,255,255,.045);
      border:1px solid rgba(255,255,255,.11);
      border-radius:16px;
      padding:22px;
      transition:.22s ease;
    }
    .cat-card:hover{
      border-color:rgba(216,154,33,.4);
      transform:translateY(-3px);
    }
    .cat-card h4{
      margin:0 0 14px;
      font:800 15px "Switzer",sans-serif;
      color:var(--gold);
      letter-spacing:-.01em;
      padding-bottom:10px;
      border-bottom:1px solid rgba(216,154,33,.22);
    }
    .cat-card ul{
      list-style:none;margin:0;padding:0;
      display:grid;gap:6px;
    }
    .cat-card li{
      font:600 13px "Switzer",sans-serif;
      color:#cfc5c6;
      line-height:1.4;
      display:flex;
      gap:8px;
      align-items:flex-start;
    }
    .cat-card li:before{
      content:"·";
      color:var(--gold);
      font-weight:800;
    }
    .wildy-note{
      margin-top:32px;
      padding:20px 24px;
      background:rgba(216,154,33,.08);
      border-left:3px solid var(--gold);
      border-radius:0 12px 12px 0;
      font:600 13px "Switzer",sans-serif;
      color:#cfc5c6;
      line-height:1.6;
    }
    .wildy-note strong{color:var(--gold);font-weight:800}

    /* Spotlight */
    .spotlight{background:var(--soft);border-block:1px solid var(--line)}
    .spotlight-head{
      display:flex;align-items:flex-end;justify-content:space-between;
      gap:20px;margin-bottom:32px;flex-wrap:wrap;
    }
    .spotlight-controls{display:flex;gap:8px}
    .spotlight-controls button{
      width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
      background:#fff;color:var(--maroon);cursor:pointer;font-size:18px;
      transition:.2s ease;
    }
    .spotlight-controls button:hover{background:var(--maroon);color:#fff}
    .spotlight-track{
      display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;
      padding-bottom:6px;scrollbar-width:none;
    }
    .spotlight-track::-webkit-scrollbar{display:none}
    .spot-card{
      min-width:340px;flex:0 0 340px;scroll-snap-align:start;
      background:#fff;border:1px solid var(--line);border-radius:20px;
      padding:24px;display:flex;flex-direction:column;
    }
    .spot-card .spot-tags{display:flex;justify-content:space-between;gap:8px;margin-bottom:16px}
    .spot-tag{
      padding:5px 9px;border-radius:8px;
      font:800 9px "Switzer",sans-serif;
      letter-spacing:.1em;text-transform:uppercase;
    }
    .spot-tag.t-academic{background:rgba(216,154,33,.15);color:#8a5c00}
    .spot-tag.t-legal{background:rgba(125,31,45,.12);color:var(--crimson)}
    .spot-tag.t-digital{background:rgba(58,11,16,.08);color:var(--maroon)}
    .spot-code{
      font:800 10px "Switzer",monospace,sans-serif;
      letter-spacing:.06em;color:#8a8a8a;
      font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
    }
    .spot-card h4{
      margin:0 0 10px;
      font:800 18px/1.25 "Switzer",Arial,sans-serif;color:var(--maroon);
      letter-spacing:-.015em;
    }
    .spot-card p{margin:0 0 14px;color:#5c6167;font-size:14px;line-height:1.5}
    .spot-meta{
      font:700 11px "Switzer",sans-serif;color:#7a7a7a;
      display:flex;gap:10px;flex-wrap:wrap;align-items:center;
      margin-bottom:18px;
    }
    .spot-meta .dot{width:4px;height:4px;border-radius:50%;background:#ccc}
    .spot-meta strong{color:var(--crimson)}
    .spot-actions{
      display:flex;gap:10px;align-items:center;justify-content:space-between;
      padding-top:16px;border-top:1px solid #eee;margin-top:auto;
    }
    .spot-actions .btn-enquire{font-size:10px}

    /* Catalog */
    .catalog-section{background:var(--paper)}
    .catalog-head{
      display:flex;justify-content:space-between;align-items:flex-end;
      gap:24px;flex-wrap:wrap;padding-bottom:24px;
      border-bottom:1px solid var(--line);margin-bottom:28px;
    }
    .catalog-tabs{
      display:flex;gap:6px;flex-wrap:wrap;
      background:#f1ece7;border-radius:14px;padding:6px;
    }
    .catalog-tab{
      padding:10px 16px;border:0;border-radius:10px;
      background:transparent;color:#666;cursor:pointer;
      font:800 11px "Switzer",sans-serif;
      letter-spacing:.06em;text-transform:uppercase;
      transition:.2s ease;
    }
    .catalog-tab:hover{color:var(--maroon)}
    .catalog-tab.active{
      background:#fff;color:var(--maroon);
      box-shadow:0 2px 8px rgba(58,11,16,.08);
    }
    .catalog-search-row{
      display:grid;grid-template-columns:1fr 220px;gap:14px;margin-bottom:32px;
    }
    .catalog-search{position:relative}
    .catalog-search input{
      width:100%;height:52px;padding:0 16px 0 46px;
      border:1px solid var(--line);border-radius:14px;
      background:#fff;color:var(--ink);outline:0;
      font:600 14px "Switzer",sans-serif;
      transition:.2s ease;
    }
    .catalog-search input:focus{border-color:var(--crimson);box-shadow:0 0 0 3px rgba(125,31,45,.1)}
    .catalog-search .search-icon{
      position:absolute;left:16px;top:50%;transform:translateY(-50%);
      color:#999;font-size:16px;
    }
    .catalog-sort{
      width:100%;height:52px;padding:0 16px;
      border:1px solid var(--line);border-radius:14px;
      background:#fff;color:var(--ink);outline:0;
      font:600 13px "Switzer",sans-serif;
    }
    .catalog-grid{
      display:grid;grid-template-columns:repeat(3,1fr);gap:22px;
    }
    .product-card{
      background:#fff;border:1px solid var(--line);border-radius:18px;
      padding:24px;display:flex;flex-direction:column;
      transition:.22s ease;
    }
    .product-card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(25,10,12,.09);border-color:#d8ccc4}
    .product-card.hidden{display:none}
    .product-tags{display:flex;justify-content:space-between;gap:8px;margin-bottom:14px;flex-wrap:wrap}
    .product-tag{
      padding:5px 9px;border-radius:8px;
      font:800 9px "Switzer",sans-serif;
      letter-spacing:.1em;text-transform:uppercase;
    }
    .pt-academic{background:rgba(216,154,33,.15);color:#8a5c00}
    .pt-legal{background:rgba(125,31,45,.12);color:var(--crimson)}
    .pt-digital{background:rgba(58,11,16,.08);color:var(--maroon)}
    .product-code{
      font:800 10px "Switzer",monospace,sans-serif;
      font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
      letter-spacing:.06em;color:#8a8a8a;
    }
    .product-card h3{
      margin:0 0 6px;
      font:800 18px/1.3 "Switzer",Arial,sans-serif;color:var(--maroon);
      letter-spacing:-.015em;
    }
    .product-card .author{
      font-style:italic;color:#777;font-size:14px;margin:0 0 14px;
    }
    .product-meta{
      font:700 11px "Switzer",sans-serif;color:#7a7a7a;
      display:grid;gap:5px;margin-bottom:18px;
    }
    .product-meta span{display:inline-flex;align-items:center;gap:8px}
    .product-meta i{color:var(--gold);font-style:normal;font-weight:800;min-width:12px}
    .product-meta .isbn{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;letter-spacing:.02em}
    .product-meta .stock{color:#0b7a4b;font-weight:800}
    .product-meta .import{color:var(--crimson);font-weight:800}
    .product-meta .license{color:var(--maroon);font-weight:800}
    .product-actions{
      display:flex;gap:10px;align-items:center;justify-content:space-between;
      margin-top:auto;padding-top:16px;border-top:1px solid #eee;
    }
    .product-actions .btn-enquire{font-size:10px}
    .product-actions .link-spec{
      background:transparent;border:0;cursor:pointer;
      font:800 10px "Switzer",sans-serif;
      letter-spacing:.08em;text-transform:uppercase;
      color:#888;transition:.2s ease;
    }
    .product-actions .link-spec:hover{color:var(--maroon)}

    /* Detailed services */
    .detail-services{background:var(--dark);color:#fff}
    .detail-services .section-head h2{color:#fff}
    .detail-services .section-head p{color:#cfc3c5}
    .detail-block{
      display:grid;grid-template-columns:1fr 1fr;gap:50px;
      padding:56px 0;border-bottom:1px solid rgba(255,255,255,.08);
    }
    .detail-block:last-of-type{border-bottom:0}
    .detail-block h3{
      margin:0 0 14px;
      font:800 28px/1.15 "Switzer",Arial,sans-serif;
      color:#fff;letter-spacing:-.02em;
    }
    .detail-block .lead{color:#c8bdbf;font-size:17px;margin:0 0 20px}
    .detail-points{list-style:none;margin:0;padding:0;display:grid;gap:12px}
    .detail-points li{display:flex;gap:12px;align-items:flex-start;color:#ded4d5;font-size:16px}
    .detail-points i{color:var(--gold);font-style:normal;font-weight:800;margin-top:3px}
    .detail-side{
      padding:26px;background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.09);border-radius:18px;
    }
    .detail-side h4{
      margin:0 0 10px;font:800 11px "Switzer",sans-serif;
      letter-spacing:.13em;text-transform:uppercase;color:var(--gold);
    }
    .detail-side p{margin:0;color:#c8bdbf;font-size:15px;line-height:1.55}
    .detail-side .cat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
    .cat-chip{
      padding:4px 9px;border-radius:6px;
      background:rgba(216,154,33,.12);color:var(--gold-soft);
      font:800 9px "Switzer",sans-serif;letter-spacing:.08em;text-transform:uppercase;
    }

    /* Institutional band */
    .inst-band{background:var(--soft);border-block:1px solid var(--line)}
    .inst-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
    .inst-band h3{
      margin:0 0 14px;
      font:800 clamp(26px,3vw,36px)/1.15 "Switzer",Arial,sans-serif;
      color:var(--maroon4f55;font-size:15px;
    }
    .division-card li i{color:var(--gold);font-style:normal;font-weight:800}
    .division-card .btn-enquire{margin-top:auto}

    /* Wildy legal subject taxonomy */
    .wildy-taxonomy{background:var(--dark);color:#fff}
    .wildy-taxonomy .section-head h2{color:#fff}
    .wildy-taxonomy .section-head p{color:#cfc3c5}
    .cat-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
